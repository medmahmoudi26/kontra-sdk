# GOLDEN FILE (seam ③), checked by tests/examples/test_golden.py: the contract `kontra
# publish` derives from models.py and offering.yaml. No key is sealed into a contract
# (spec x-kontra.v2.json), so this is the document -- and the contract_hash -- that
# anyone publishing this example gets.
# Regenerate after a deliberate contract change:
#   UPDATE_GOLDEN=1 pytest tests/examples/test_golden.py
nexusrpc: "1.0.0"
$schema: https://json-schema.org/draft/2020-12/schema
services:
  AcmeChefClaude:
    fqn: acme.chef-claude
    description: One dish from what is in the pantry, cooked up by Claude Code
    operations:
      quote:
        fqn: quote
        description: 'Price this input. Cheap and synchronous: answers ok with a fixed price, rejected with a reason, or busy with an ETA. Nothing runs and nothing is charged.'
        input:
          $ref: '#/$defs/CookInput'
        output:
          $ref: '#/$defs/KontraQuote'
      execute:
        fqn: execute
        description: Run the job on this input. Requires a Kontra hold token in the kontra-hold header; the result is delivered encrypted to the buyer and paid from escrow.
        input:
          $ref: '#/$defs/CookInput'
        output:
          $ref: '#/$defs/Dish'
$defs:
  CookInput:
    type: object
    additionalProperties: false
    properties:
      craving:
        description: What you feel like eating.
        type: string
        maxLength: 500
        minLength: 1
    required:
    - craving
  Dish:
    type: object
    additionalProperties: false
    properties:
      recipe:
        description: One dish from what is in the pantry, and how to make it.
        type: string
    required:
    - recipe
  KontraQuote:
    description: 'The answer of the quote operation. ok: a fixed price (amount_minor in the currency''s minor unit, e.g. cents) valid for a job of at most max_duration_seconds. rejected: the seller will not take this input, with a reason. busy: try again after eta_seconds.'
    type: object
    additionalProperties: false
    properties:
      amount_minor:
        type: integer
        maximum: 9007199254740991
        minimum: 0
      currency:
        type: string
        pattern: ^[A-Z][A-Z0-9]{2,7}$
      eta_seconds:
        type: integer
        maximum: 2592000
        minimum: 0
      max_duration_seconds:
        type: integer
        maximum: 2592000
        minimum: 1
      reason:
        type: string
        maxLength: 1000
        minLength: 1
      status:
        type: string
        enum:
        - ok
        - rejected
        - busy
    required:
    - status
x-kontra:
  name: acme/chef-claude
  version: "0.1.0"
  description: One dish from what is in the pantry, cooked up by Claude Code
  pricing_hint: $0.25 per dish
  tags:
  - agents
  - claude
  - example
  max_duration: "30m"
  review_window: "1d"
  max_concurrent_jobs: 10
  max_output_bytes: "1MB"
  artifact_retention: "7d"
  uses_hosted_model: true
  contract_hash: sha256:c9fdf1e6f4e56d8e3b0d32e402eb0bc12856a95b2bea5fd983568efdf69af994
