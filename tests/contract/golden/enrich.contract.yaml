nexusrpc: "1.0.0"
$schema: https://json-schema.org/draft/2020-12/schema
services:
  AcmeEnrich:
    fqn: acme.enrich
    description: Resolve a URL list to company records
    operations:
      quote:
        fqn: quote
        description: 'Price this input. Cheap and synchronous: answers ok with a fixed price, rejected with a reason, or busy with an ETA. Nothing runs and nothing is charged.'
        input:
          $ref: '#/$defs/EnrichInput'
        output:
          $ref: '#/$defs/KontraQuote'
      execute:
        fqn: execute
        description: Run the job on this input. Requires a Kontra hold token in the kontra-hold header; the result is delivered encrypted to the buyer and paid from escrow.
        input:
          $ref: '#/$defs/EnrichInput'
        output:
          $ref: '#/$defs/EnrichOutput'
$defs:
  EnrichInput:
    description: URLs to resolve to company records.
    type: object
    additionalProperties: false
    properties:
      urls:
        type: array
        items:
          type: string
          format: uri
          maxLength: 2048
          minLength: 1
        maxItems: 10000
        minItems: 1
    required:
    - urls
  EnrichOutput:
    description: Company records as JSON lines, and a count per resolution status.
    type: object
    additionalProperties: false
    properties:
      records:
        $ref: '#/$defs/KontraArtifact'
      summary:
        type: object
        additionalProperties:
          type: integer
    required:
    - records
    - summary
  KontraArtifact:
    description: 'A file in the claim-check bucket, encrypted (age) to the job''s parties: a reference, never the bytes. size and sha256 are of the plaintext; a download verifies both.'
    type: object
    additionalProperties: false
    properties:
      content_type:
        type: string
        maxLength: 255
        minLength: 1
      key:
        type: string
        maxLength: 32
        minLength: 32
        pattern: ^[0-9a-f]{32}$
      sha256:
        type: string
        pattern: ^[0-9a-f]{64}$
      size:
        type: integer
        minimum: 0
    required:
    - content_type
    - key
    - sha256
    - size
  KontraQuote:
    description: 'The answer of the quote operation. ok: a fixed price (amount_minor in the currency''s minor unit, e.g. cents) valid for a job of at most max_duration_seconds. rejected: the seller will not take this input, with a reason. busy: try again after eta_seconds.'
    type: object
    additionalProperties: false
    properties:
      amount_minor:
        type: integer
        maximum: 9007199254740991
        minimum: 0
      currency:
        type: string
        pattern: ^[A-Z][A-Z0-9]{2,7}$
      eta_seconds:
        type: integer
        maximum: 2592000
        minimum: 0
      max_duration_seconds:
        type: integer
        maximum: 2592000
        minimum: 1
      reason:
        type: string
        maxLength: 1000
        minLength: 1
      status:
        type: string
        enum:
        - ok
        - rejected
        - busy
    required:
    - status
x-kontra:
  name: acme/enrich
  version: "1.2.0"
  description: Resolve a URL list to company records
  pricing_hint: $0.001 per url
  tags:
  - companies
  - enrichment
  max_duration: "6h"
  review_window: "1d"
  max_concurrent_jobs: 10
  max_output_bytes: "5GB"
  artifact_retention: "7d"
  public_key: age1e0q4lyexsefmh6hurumvgl3cmmsfnz4zyfhkd7lfrjcpqc2e250qs6j4el
  contract_hash: sha256:9fbf215aa98e63f5909d3a5cec70915573583e32515f73845c9032632b0a7e38
