[project]
name = "kontra-sdk"
version = "0.2.4"
description = "Sell and hire durable, quoted jobs: plain Temporal workers behind Nexus, with escrow and end-to-end encryption."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mohamed Mahmoudi" }]
keywords = ["temporal", "nexus", "marketplace", "escrow", "workflows", "mcp", "agents"]
# No license classifier: `license` is an SPDX expression (PEP 639), which replaces them.
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]
# temporalio: the range kontra-sdk is tested on (decisions I29). Sellers import temporalio
# directly, so compatibility is a dependency problem, not an import path: the codec relies on
# experimental APIs (serialization context, Nexus operation info), so the range only widens
# after a green suite on the new minor. kontra/_compat.py holds the same range (a test keeps
# them equal); KontraPlugin refuses to start outside it, `kontra serve`/`publish` warn.
dependencies = [
  "temporalio>=1.34,<1.38",
  "pydantic>=2.12,<3",  # Field(exclude_if=), model_validate_json(extra=): both 2.12
  "httpx>=0.27,<1",
  "pyyaml>=6",
  "pyrage>=1.2,<2",
  "pyjwt[crypto]>=2.9,<3",
  "jsonschema>=4.23,<5",
  "rfc8785>=0.1.4,<0.2",
  "click>=8.1,<9",
  # Seller-supplied contract patterns run on buyers' and sellers' machines: RE2 matches in
  # linear time, so no pattern can stall a handler (Python's re backtracks).
  "google-re2>=1.1,<2",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]  # kontra.mcp is written on MCPServer (mcp 2.x)
# `kontra serve --otlp`: Temporal's TracingInterceptor (temporalio's own extra of the same
# name) and the OTLP/gRPC span exporter.
opentelemetry = [
  "temporalio[opentelemetry]>=1.34,<1.38",
  "opentelemetry-exporter-otlp-proto-grpc>=1.39,<2",
]
# `kontra dev up` runs the dev gate (kontra.devgate) under FastAPI/uvicorn; a fleet worker that
# never serves the gate installs neither. [testing] includes [dev] (a packaging test pins dev ⊆
# testing), so the scaffold's `pip install "kontra-sdk[testing]"` already covers `kontra dev up`.
dev = ["fastapi>=0.115", "uvicorn>=0.30"]
# webauthn (duo-labs, BSD): the fake gate verifies real passkey answers with the same code as the
# platform (kontra._passkeys, decisions I24), and kontra.testing.SoftAuthenticator makes them.
testing = ["fastapi>=0.115", "uvicorn>=0.30", "hypothesis>=6.100", "webauthn>=3.0.1,<4"]

[project.scripts]
kontra = "kontra.cli:main"

[project.urls]
Homepage = "https://kontra.run"
Source = "https://github.com/medmahmoudi26/kontra-sdk"
Issues = "https://github.com/medmahmoudi26/kontra-sdk/issues"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=1.0",
  "pytest-timeout>=2.3",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "mcp>=2.3,<3",
  "a2a-sdk>=1.0",
  "psutil>=6",
  "boto3>=1.35",
  "webauthn>=3.0.1,<4",
  # A seller's agent dependencies are the seller's (decisions I29): these are for kontra-sdk's
  # own checks. Temporal's OpenAI Agents integration: `kontra graph`'s scripted model
  # (kontra/cli/_scripted.py, under pyright strict) and examples/chef-agents' tests.
  "temporalio-openai-agents[mcp]>=1.1,<2",
  # Temporal's agent harness (the PRD's pin): the bound-handler tests run a real agent, and
  # check Kontra's copy of its wire shape (kontra/serve/turn.py). Never a runtime import.
  "temporal-agent-harness==0.6.0",
]

[build-system]
# Exact: the backend decides what goes into the sdist and the wheel PyPI serves, so a new
# hatchling reaches a release only through a reviewed bump, never by being the newest
# release on the day `uv build` runs.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

# What PyPI gets: the package, the README and the licence. No tests/, temporal/, docs/ or
# spec/ at the top of either distribution, and nothing about upstream Temporal issues the
# Authorizer works around (tests/packaging checks both, on a real `uv build`).
[tool.hatch.build.targets.wheel]
packages = ["kontra"]

# The spec files and `kontra dev up --observability`'s observability/ compose file with the
# docs/dashboards/ files it mounts (one copy each, outside the package in a checkout) go into the
# package: from the checkout, or already there in the sdist. The e2e compose.yaml is not shipped.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# Anchored (leading "/"): hatch reads these as gitignore patterns, so a bare "README.md"
# also matched .scratch/README.md, examples/*/README.md and temporal/authorizer/README.md.
# hatch_build.py is the wheel's build hook, needed to build a wheel from the sdist.
include = ["/kontra", "/README.md", "/LICENSE", "/hatch_build.py"]

[tool.hatch.build.targets.sdist.force-include]
"spec" = "kontra/_spec"
"observability" = "kontra/_dev/observability"
"docs/dashboards" = "kontra/_dev/docs/dashboards"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples/*/gen", "tests/golden"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF", "SIM", "PT"]
ignore = ["S101", "E501", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"examples/**" = ["S"]

[tool.pyright]
include = ["kontra"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportPrivateUsage = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 300
markers = [
  "e2e: needs the e2e stack running (make stack-up: compose.yaml, the prod gate image)",
  "temporal: starts a local Temporal dev server (no containers)",
  "slow: long-running (large artifacts, property tests at full size)",
]
addopts = "-m 'not e2e'"
