[project]
name = "kontra-sdk"
version = "0.1.0"
description = "Sell and hire durable, quoted jobs: plain Temporal workers behind Nexus, with escrow and end-to-end encryption."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mohamed Mahmoudi" }]
keywords = ["temporal", "nexus", "marketplace", "escrow", "workflows", "mcp", "agents"]
# No license classifier: `license` is an SPDX expression (PEP 639), which replaces them.
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]
# temporalio is pinned to a minor: standalone Nexus operations and serialization
# context are experimental there, and a minor bump may change them.
dependencies = [
  "temporalio>=1.34,<1.35",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "pyyaml>=6",
  "pyrage>=1.2,<2",
  "pyjwt[crypto]>=2.9,<3",
  "jsonschema>=4.23,<5",
  "rfc8785>=0.1.4,<0.2",
  "click>=8.1,<9",
  # Seller-supplied contract patterns run on buyers' and sellers' machines: RE2 matches in
  # linear time, so no pattern can stall a handler (Python's re backtracks).
  "google-re2>=1.1,<2",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]  # kontra.mcp is written on MCPServer (mcp 2.x)
# Temporal's OpenAI Agents integration (temporalio.openai_agents): kontra.workflow re-exports
# activity_as_tool and mcp_server, and serve() installs its plugin. [mcp]: serve(mcp_servers=).
agents = ["temporalio-openai-agents[mcp]>=1.1,<2"]
# `kontra serve --otlp`: Temporal's TracingInterceptor (temporalio's own extra of the same
# name) and the OTLP/gRPC span exporter.
opentelemetry = [
  "temporalio[opentelemetry]>=1.34,<1.35",
  "opentelemetry-exporter-otlp-proto-grpc>=1.39,<2",
]
testing = ["fastapi>=0.115", "uvicorn>=0.30", "hypothesis>=6.100"]

[project.scripts]
kontra = "kontra.cli:main"

[project.urls]
Homepage = "https://kontra.run"
Source = "https://github.com/medmahmoudi26/kontra-sdk"
Issues = "https://github.com/medmahmoudi26/kontra-sdk/issues"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=1.0",
  "pytest-timeout>=2.3",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "mcp>=2.3,<3",
  "a2a-sdk>=1.0",
  "psutil>=6",
  "boto3>=1.35",
]

[build-system]
# Exact: the backend decides what goes into the sdist and the wheel PyPI serves, so a new
# hatchling reaches a release only through a reviewed bump, never by being the newest
# release on the day `uv build` runs.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

# What PyPI gets: the package, the README and the licence. No tests/, temporal/, docs/ or
# spec/ at the top of either distribution, and nothing about upstream Temporal issues the
# Authorizer works around (tests/packaging checks both, on a real `uv build`).
[tool.hatch.build.targets.wheel]
packages = ["kontra"]

# The spec files and `kontra dev`'s compose.yaml with the observability/ and docs/dashboards/
# files it mounts (one copy each, outside the package in a checkout) go into the package: from
# the checkout, or already there in the sdist.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# Anchored (leading "/"): hatch reads these as gitignore patterns, so a bare "README.md"
# also matched .scratch/README.md, examples/*/README.md and temporal/authorizer/README.md.
# hatch_build.py is the wheel's build hook, needed to build a wheel from the sdist.
include = ["/kontra", "/README.md", "/LICENSE", "/hatch_build.py"]

[tool.hatch.build.targets.sdist.force-include]
"spec" = "kontra/_spec"
"compose.yaml" = "kontra/_dev/compose.yaml"
"observability" = "kontra/_dev/observability"
"docs/dashboards" = "kontra/_dev/docs/dashboards"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples/*/gen", "tests/golden"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF", "SIM", "PT"]
ignore = ["S101", "E501", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"examples/**" = ["S"]

[tool.pyright]
include = ["kontra"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportPrivateUsage = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 300
markers = [
  "e2e: needs the `kontra dev` stack (compose) running",
  "temporal: starts a local Temporal dev server (no containers)",
  "slow: long-running (large artifacts, property tests at full size)",
]
addopts = "-m 'not e2e'"
