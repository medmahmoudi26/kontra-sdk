<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>Kontra Run Graph</title>
<style nonce="__NONCE__">
/* kontra dev's run graph: the whole workflow (the static layer kontra serve draws), the live run painted on it.
   Served by the dev codec server on loopback; no external resources (its CSP allows none). */
:root{
  --ground:#f2f4f2;--panel:#ffffff;--ink:#1a1f1c;--mute:#5f6b65;--line:#d6dcd8;--edge:#9aa49f;--ghost:#b3bbb7;
  --accent:#2457c5;--ok:#1f7f45;--run:#2468d3;--wait:#9a6a0c;--bad:#bf3b2c;--group:rgba(36,87,197,.06);
  --code:#f6f7f6;--shadow:0 1px 2px rgba(20,30,25,.06);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0f1312;--panel:#161b19;--ink:#e0e6e2;--mute:#8c9791;--line:#28302c;--edge:#5d6862;--ghost:#47524c;
  --accent:#7da3ff;--ok:#4cb874;--run:#64a6ff;--wait:#d9a441;--bad:#f06b57;--group:rgba(125,163,255,.08);
  --code:#111614;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0f1312;--panel:#161b19;--ink:#e0e6e2;--mute:#8c9791;--line:#28302c;--edge:#5d6862;--ghost:#47524c;
  --accent:#7da3ff;--ok:#4cb874;--run:#64a6ff;--wait:#d9a441;--bad:#f06b57;--group:rgba(125,163,255,.08);
  --code:#111614;--shadow:none;color-scheme:dark}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.45 var(--sans)}
.wrap{display:flex;flex-direction:column;gap:12px;min-height:100%;box-sizing:border-box;
  padding-block:0 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
code,.mono{font-family:var(--mono)}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;padding-block:14px 12px;border-bottom:1px solid var(--line)}
.ident{display:flex;flex-direction:column;gap:3px;min-width:0}
.kicker{font:600 11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.kicker a{color:inherit}
h1{margin:0;font:600 20px/1.2 var(--sans);text-wrap:balance;overflow-wrap:anywhere}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;color:var(--mute);font-size:13px}
.sub code{font-size:12.5px;color:var(--ink);overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a,.links span{display:inline-flex;align-items:center;gap:6px;font:500 13px/1 var(--sans);padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.links span{color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--mono);letter-spacing:.03em;padding:4px 8px;border-radius:999px;border:1px solid currentColor;color:var(--mute);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-completed{color:var(--ok)}.s-running,.s-continued_as_new{color:var(--run)}.s-scheduled{color:var(--wait)}
.s-failed,.s-timed_out,.s-terminated{color:var(--bad)}.s-canceled,.s-unreached,.s-pending{color:var(--mute)}
.notice{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 12px;color:var(--mute);font-size:13px}
.notice code{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mute);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:10px;border:1.5px solid currentColor;border-radius:3px}
.legend i.dash{border-style:dashed}.legend i.dot{border-style:dotted}
.stack{display:flex;flex-direction:column;gap:12px}.pad{padding:12px}
.legend .k-group{border-style:dashed;background:var(--group);border-color:var(--accent)}
.legend .k-child{box-shadow:inset 0 0 0 2px var(--panel),inset 0 0 0 3px currentColor}
.legend .k-timer{border-radius:6px}
.legend .k-unreached{border-style:dotted}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.canvas{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;box-shadow:var(--shadow);min-height:180px}
.canvas svg{display:block;margin:auto}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
@media (min-width:901px){.pane{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}}
.pane-empty{margin:0;color:var(--mute)}
.pane h2{margin:0;font:600 16px/1.3 var(--mono);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font:500 11px/1 var(--mono);padding:4px 7px;border-radius:4px;background:var(--code);border:1px solid var(--line);color:var(--mute)}
dl.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:5px 14px;margin:0;font-size:13px}
dl.facts dt{color:var(--mute)}dl.facts dd{margin:0;font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.pane h3{margin:4px 0 -4px;font:600 11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 var(--mono);background:var(--code);border:1px solid var(--line);border-radius:6px;padding:8px 10px;max-height:260px;overflow:auto}
.fail{border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 7%,var(--panel));border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.fail strong{font:600 12px/1.3 var(--mono);color:var(--bad)}
.fail p{margin:0;font:12.5px/1.45 var(--mono);overflow-wrap:anywhere}
.fail details summary{cursor:pointer;color:var(--mute);font-size:12px}
.muted{color:var(--mute);font-size:13px;margin:0}
.runs{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.runs table{border-collapse:collapse;width:100%;font-size:13px}
.runs th,.runs td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.runs th{font:600 11px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.runs td.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
/* the graph */
.edge{fill:none;stroke:var(--edge);stroke-width:1.5}
.edge.dim{stroke:var(--ghost);stroke-dasharray:3 4}
.edge.back{stroke-dasharray:6 4}
.grp{fill:var(--group);stroke:var(--accent);stroke-opacity:.45;stroke-dasharray:4 4}
.grp-label{font:600 9.5px var(--mono);letter-spacing:.08em;fill:var(--accent);opacity:.8;text-transform:uppercase}
.node{cursor:pointer;outline:none}
.node>.box{fill:var(--panel);stroke:var(--edge);stroke-width:1.4}
.node>.stripe{fill:var(--ghost)}
.node>.inner{fill:none;stroke:var(--edge);stroke-width:1}
.node>.name{font:600 12.5px var(--mono);fill:var(--ink)}
.node>.meta{font:11px var(--sans);fill:var(--mute)}
.node .badge rect{fill:var(--panel);stroke-width:1.2}
.node .badge text{font:700 10.5px var(--mono)}
.node.s-completed>.box{stroke:var(--ok)}.node.s-completed>.stripe{fill:var(--ok)}
.node.s-running>.box{stroke:var(--run);stroke-dasharray:6 3}.node.s-running>.stripe{fill:var(--run)}
.node.s-scheduled>.box{stroke:var(--wait);stroke-dasharray:2 3}.node.s-scheduled>.stripe{fill:var(--wait)}
.node.s-failed>.box,.node.s-timed_out>.box,.node.s-terminated>.box{stroke:var(--bad)}
.node.s-failed>.stripe,.node.s-timed_out>.stripe,.node.s-terminated>.stripe{fill:var(--bad)}
.node.s-canceled>.box{stroke:var(--mute)}
.node.s-unreached>.box,.node.s-pending>.box{stroke:var(--ghost);stroke-dasharray:2 3}
.node.s-unreached>.name,.node.s-pending>.name{fill:var(--mute)}
.node.k-local>.box{stroke-dasharray:5 3}
.node.sel>.box{stroke-width:2.6}
.node:focus-visible>.box{stroke:var(--accent);stroke-width:2.6}
.node:hover>.box{stroke-width:2.2}
.bad-t{fill:var(--bad)}.wait-t{fill:var(--wait)}.run-t{fill:var(--run)}.mute-t{fill:var(--mute)}
.badge .bad-s{stroke:var(--bad)}.badge .wait-s{stroke:var(--wait)}.badge .mute-s{stroke:var(--line)}
.badge .wait-s.needs{fill:color-mix(in srgb,var(--wait) 12%,var(--panel))}
.term circle{fill:var(--panel);stroke:var(--edge);stroke-width:1.4}
.term text{font:600 10px var(--mono);fill:var(--mute);letter-spacing:.04em}
.term.done circle{stroke:var(--ok)}
.arrow{fill:var(--edge)}.arrow-dim{fill:var(--ghost)}
@media (prefers-reduced-motion:no-preference){
  .node.s-running>.box{animation:march 1.1s linear infinite}
  @keyframes march{to{stroke-dashoffset:-18}}
}
/* the agent session pane, beside the graph (decisions I36): the same tokens, one page */
@media (min-width:901px){.split.agent{grid-template-columns:minmax(0,1fr) 420px}}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.controls button{display:inline-flex;align-items:center;gap:6px;font:500 13px/1 var(--sans);padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer}
.controls button:hover{border-color:var(--accent)}
h1 .off{color:var(--accent)}
.ind{display:inline-flex;align-items:center;gap:5px;font:500 12px/1 var(--mono);color:var(--mute);white-space:nowrap}
.ind::before{content:"\25c9";color:var(--ok)}
.ind.off::before{color:var(--ghost)}
.rightcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column}
#session{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
/* wide: the column stays in view, as tall as the room below its top (fit(), from the page's
   script); the session takes what the node pane does not need, and scrolls on its own */
@media (min-width:901px){
  .rightcol{position:sticky;top:12px;max-height:calc(100vh - 24px)}
  .rightcol.fitted{max-height:none}
  .rightcol>.card{flex:0 1 auto;min-height:0}
  .rightcol .rows-wrap{overflow:auto;flex:1 1 auto;min-height:0}
  .rightcol.fitted .pane{position:static;flex:0 0 auto;max-height:50%;overflow:auto}
}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.chead h2{margin:0;font:600 12px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.strm{font:500 11.5px/1 var(--mono);color:var(--mute);display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.strm::before{content:"\25c9";color:var(--ok)}
.strm.off::before{color:var(--ghost)}
.rows-wrap{padding:4px 0 6px;min-height:0}
.turnhead{display:flex;gap:6px;align-items:baseline;padding:9px 14px 5px;color:var(--mute);font:12.5px/1.3 var(--mono);white-space:nowrap}
.turnhead b{color:var(--ink);font-weight:600}
.turnhead .sig{overflow:hidden;text-overflow:ellipsis;min-width:0}
.turnhead .tstatus{margin-left:auto}
.row{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:3px 14px 3px 11px;border-left:3px solid transparent}
.row.islink{cursor:pointer}
.row.islink:hover,.row.isbody:hover{background:var(--code)}
.row.isbody{cursor:pointer}
.row.sel{background:color-mix(in srgb,var(--accent) 9%,var(--panel));border-left-color:var(--accent)}
.row.nest{padding-left:33px}
.row.nest.d2{padding-left:55px}.row.nest.d3{padding-left:77px}
.row.nest .g::before{content:"\2514\00a0";color:var(--ghost);margin-left:-14px}
.row .g{font-family:var(--mono);color:var(--mute);text-align:center;white-space:nowrap}
.row .mid{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .lbl{font:600 12.5px/1.4 var(--mono);color:var(--ink)}
.row .sum{color:var(--mute);font-size:12.5px}
.row .rt{font:11px/1 var(--mono);color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.row.working .g{color:var(--run)}.row.scheduled .g{color:var(--wait)}
.row.completed .g{color:var(--ok)}
.row.failed .g,.row.failed .lbl{color:var(--bad)}
.row.generic .lbl{font-weight:500;color:var(--mute)}
.usage{font:10.5px/1 var(--mono);color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:2px 5px}
.subnote{padding:2px 14px 4px 47px;color:var(--mute);font:11.5px/1.4 var(--mono)}
.subnote a{color:var(--accent)}
.appr{margin:3px 14px 8px 38px;border:1px solid color-mix(in srgb,var(--wait) 45%,transparent);background:color-mix(in srgb,var(--wait) 7%,var(--panel));border-radius:7px;padding:9px 11px;display:flex;flex-direction:column;gap:7px}
.appr .to{font:12.5px/1.35 var(--mono);color:var(--ink);overflow-wrap:anywhere}
.appr .act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.appr .note{color:var(--mute);font-size:11.5px;line-height:1.35}
.sfooter{display:flex;flex-wrap:wrap;gap:4px 14px;padding:10px 14px;border-top:1px solid var(--line);color:var(--mute);font:11.5px/1.45 var(--mono)}
.sfooter .key{font-variant-numeric:tabular-nums;color:var(--ink)}
.sess-empty{padding:14px;color:var(--mute);font-size:13px}
.sess-empty p{margin:0}
.pane h2{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pane h2 .k{font:600 11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.pane h2 .pill{margin-left:auto}
/* a child drawn nested: its own graph inside its node */
.node.compound>.box{fill:color-mix(in srgb,var(--group) 60%,var(--panel))}
.nest-label{font:600 9.5px var(--mono);letter-spacing:.08em;fill:var(--accent);opacity:.8;text-transform:uppercase}
@media (prefers-reduced-motion:no-preference){
  .node.flash>.box{animation:nodeflash 1.2s ease-out}
  @keyframes nodeflash{0%{stroke-width:5;stroke:var(--accent)}100%{stroke-width:2.6}}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="ident">
      <span class="kicker"><a id="to-runs" href="?">kontra dev · runs</a> / graph</span>
      <h1 id="wf-type">Loading…</h1>
      <div class="sub"><code id="wf-id"></code><span id="wf-status" class="pill" hidden></span><span id="ind" class="ind off" hidden>/api/events</span><span id="sess-queue"></span><span id="sess-run"></span><span id="wf-time"></span></div>
    </div>
    <div class="controls">
      <button id="replay" type="button" hidden>↺ Replay</button>
      <nav id="wf-links" class="links" aria-label="This run elsewhere"></nav>
    </div>
  </header>
  <p id="notice" class="notice" hidden></p>
  <div id="graph-view" hidden>
    <div class="legend" aria-label="Legend">
      <span class="s-completed"><i></i>completed</span>
      <span class="s-running"><i class="dash"></i>running</span>
      <span class="s-scheduled"><i class="dot"></i>scheduled / backing off</span>
      <span class="s-failed"><i></i>failed</span>
      <span class="s-unreached"><i class="k-unreached"></i>branch not taken</span>
      <span><i class="k-group"></i>one workflow task (parallel)</span>
      <span><i class="k-child"></i>child workflow / batch</span>
      <span><i class="k-timer"></i>timer</span>
    </div>
    <div id="split" class="split">
      <main id="canvas" class="canvas" aria-label="Workflow graph"></main>
      <div id="rightcol" class="rightcol">
        <section id="session-card" class="card" hidden aria-label="Agent session">
          <header class="chead"><h2>Session</h2><span id="strm" class="strm off" hidden></span></header>
          <div id="session"></div>
          <div id="session-footer" class="sfooter" hidden></div>
        </section>
        <aside id="pane" class="pane" aria-live="polite"><p class="pane-empty">Select a step to see its attempts, timing, input and result, and to open it in Temporal UI, its logs or its trace.</p></aside>
      </div>
    </div>
  </div>
  <section id="runs-view" class="runs" hidden aria-label="Recent runs"></section>
</div>

<script nonce="__NONCE__">
"use strict";
(() => {
const START = "start", END = "end";
const SVGNS = "http://www.w3.org/2000/svg";
const H = 54, R = 20, GX = 60, GY = 20;
// A child drawn nested (the agent child): its header band, and the padding round its own graph.
const BOX_HEAD = 78, BOX_PAD = 16;
let W = 184; // narrower in a vertical layout, to fit the screen

// ------------------------------------------------------------------ transport
// The dev codec server's routes. A page that defines window.KONTRA_CONSOLE (a preview) supplies its own.
const params = new URLSearchParams(location.search);
const api = window.KONTRA_CONSOLE || {
  query: { w: params.get("w"), r: params.get("r") },
  async json(url, headers) {
    const res = await fetch(url, { headers: { Accept: "application/json", ...(headers || {}) }, cache: "no-store" });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `${res.status} ${res.statusText}`);
    return body;
  },
  qs(w, r, extra) { const q = new URLSearchParams({ w }); if (r) q.set("r", r); for (const [k, v] of Object.entries(extra || {})) q.set(k, v); return q.toString(); },
  workflows() { return this.json("/api/workflows"); },
  // Both panes from one fetch, behind the header (OD2): {graph, session}.
  session(w, r) { return this.json(`/api/session?${this.qs(w, r)}`, { "X-Kontra-Console": "1" }); },
  io(w, r, node) { return this.json(`/api/io?${this.qs(w, r, { node })}`, { "X-Kontra-Console": "1" }); },
  ioEvent(w, r, offset) { return this.json(`/api/io?${this.qs(w, r, { event: String(offset) })}`, { "X-Kontra-Console": "1" }); },
  subscribe(w, r, on) {
    // A change signal only: each session-stat sends the page back to /api/session.
    const es = new EventSource(`/api/events?${this.qs(w, r)}`);
    es.addEventListener("session-stat", ev => { try { on.stat(JSON.parse(ev.data)); } catch (_) { /* a torn frame: the next one says it again */ } });
    es.addEventListener("end", () => { es.close(); on.end(); });
    es.addEventListener("open", () => on.open());
    // EventSource reconnects by itself; once the server refuses (too many pages open, the
    // codec server stopped) it gives up, and the page says so.
    es.addEventListener("error", () => { if (es.readyState === EventSource.CLOSED) on.lost(); else on.end(); });
    return () => es.close();
  },
  href(w, r) { return w ? `?${this.qs(w, r)}` : "?"; },
  now() { return Date.now(); },
};

// ------------------------------------------------------------------ helpers
const $ = id => document.getElementById(id);
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null && v !== false) n.setAttribute(k, v === true ? "" : String(v));
  for (const k of kids) if (k != null) n.append(k instanceof Node ? k : String(k));
  return n;
}
function sv(tag, attrs, ...kids) {
  const n = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) n.setAttribute(k, String(v));
  for (const k of kids) if (k != null) n.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return n;
}
const ms = iso => { const t = iso ? Date.parse(iso) : NaN; return Number.isNaN(t) ? null : t; };
function dur(a, b) {
  if (a == null || b == null) return null;
  const d = Math.max(0, b - a);
  if (d < 1000) return `${Math.round(d)} ms`;
  if (d < 60000) return `${(d / 1000).toFixed(d < 10000 ? 2 : 1)} s`;
  const m = Math.floor(d / 60000), s = Math.round((d % 60000) / 1000);
  return m < 60 ? `${m} m ${String(s).padStart(2, "0")} s` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")} m`;
}
const clock = iso => { const t = ms(iso); return t == null ? "—" : new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }); };
