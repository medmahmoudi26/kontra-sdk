<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>Kontra Run Graph</title>
<style nonce="__NONCE__">
/* kontra dev's run graph: the whole workflow (the static layer kontra serve draws), the live run painted on it.
   Served by the dev codec server on loopback; no external resources (its CSP allows none). */
:root{
  --ground:#f2f4f2;--panel:#ffffff;--ink:#1a1f1c;--mute:#5f6b65;--line:#d6dcd8;--edge:#9aa49f;--ghost:#b3bbb7;
  --accent:#2457c5;--ok:#1f7f45;--run:#2468d3;--wait:#9a6a0c;--bad:#bf3b2c;--group:rgba(36,87,197,.06);
  --code:#f6f7f6;--shadow:0 1px 2px rgba(20,30,25,.06);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0f1312;--panel:#161b19;--ink:#e0e6e2;--mute:#8c9791;--line:#28302c;--edge:#5d6862;--ghost:#47524c;
  --accent:#7da3ff;--ok:#4cb874;--run:#64a6ff;--wait:#d9a441;--bad:#f06b57;--group:rgba(125,163,255,.08);
  --code:#111614;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0f1312;--panel:#161b19;--ink:#e0e6e2;--mute:#8c9791;--line:#28302c;--edge:#5d6862;--ghost:#47524c;
  --accent:#7da3ff;--ok:#4cb874;--run:#64a6ff;--wait:#d9a441;--bad:#f06b57;--group:rgba(125,163,255,.08);
  --code:#111614;--shadow:none;color-scheme:dark}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.45 var(--sans)}
.wrap{display:flex;flex-direction:column;gap:12px;min-height:100%;box-sizing:border-box;
  padding-block:0 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
code,.mono{font-family:var(--mono)}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;padding-block:14px 12px;border-bottom:1px solid var(--line)}
.ident{display:flex;flex-direction:column;gap:3px;min-width:0}
.kicker{font:600 11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.kicker a{color:inherit}
h1{margin:0;font:600 20px/1.2 var(--sans);text-wrap:balance;overflow-wrap:anywhere}
.sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;color:var(--mute);font-size:13px}
.sub code{font-size:12.5px;color:var(--ink);overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a,.links span{display:inline-flex;align-items:center;gap:6px;font:500 13px/1 var(--sans);padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.links span{color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--mono);letter-spacing:.03em;padding:4px 8px;border-radius:999px;border:1px solid currentColor;color:var(--mute);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-completed{color:var(--ok)}.s-running,.s-continued_as_new{color:var(--run)}.s-scheduled{color:var(--wait)}
.s-failed,.s-timed_out,.s-terminated{color:var(--bad)}.s-canceled,.s-unreached,.s-pending{color:var(--mute)}
.notice{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 12px;color:var(--mute);font-size:13px}
.notice code{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mute);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:10px;border:1.5px solid currentColor;border-radius:3px}
.legend i.dash{border-style:dashed}.legend i.dot{border-style:dotted}
.stack{display:flex;flex-direction:column;gap:12px}.pad{padding:12px}
.legend .k-group{border-style:dashed;background:var(--group);border-color:var(--accent)}
.legend .k-child{box-shadow:inset 0 0 0 2px var(--panel),inset 0 0 0 3px currentColor}
.legend .k-timer{border-radius:6px}
.legend .k-unreached{border-style:dotted}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.canvas{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;box-shadow:var(--shadow);min-height:180px}
.canvas svg{display:block;margin:auto}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
@media (min-width:901px){.pane{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}}
.pane-empty{margin:0;color:var(--mute)}
.pane h2{margin:0;font:600 16px/1.3 var(--mono);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font:500 11px/1 var(--mono);padding:4px 7px;border-radius:4px;background:var(--code);border:1px solid var(--line);color:var(--mute)}
dl.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:5px 14px;margin:0;font-size:13px}
dl.facts dt{color:var(--mute)}dl.facts dd{margin:0;font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.pane h3{margin:4px 0 -4px;font:600 11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 var(--mono);background:var(--code);border:1px solid var(--line);border-radius:6px;padding:8px 10px;max-height:260px;overflow:auto}
.fail{border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 7%,var(--panel));border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.fail strong{font:600 12px/1.3 var(--mono);color:var(--bad)}
.fail p{margin:0;font:12.5px/1.45 var(--mono);overflow-wrap:anywhere}
.fail details summary{cursor:pointer;color:var(--mute);font-size:12px}
.muted{color:var(--mute);font-size:13px;margin:0}
.runs{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.runs table{border-collapse:collapse;width:100%;font-size:13px}
.runs th,.runs td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.runs th{font:600 11px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.runs td.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
/* the graph */
.edge{fill:none;stroke:var(--edge);stroke-width:1.5}
.edge.dim{stroke:var(--ghost);stroke-dasharray:3 4}
.edge.back{stroke-dasharray:6 4}
.grp{fill:var(--group);stroke:var(--accent);stroke-opacity:.45;stroke-dasharray:4 4}
.grp-label{font:600 9.5px var(--mono);letter-spacing:.08em;fill:var(--accent);opacity:.8;text-transform:uppercase}
.node{cursor:pointer;outline:none}
.node .box{fill:var(--panel);stroke:var(--edge);stroke-width:1.4}
.node .stripe{fill:var(--ghost)}
.node .inner{fill:none;stroke:var(--edge);stroke-width:1}
.node .name{font:600 12.5px var(--mono);fill:var(--ink)}
.node .meta{font:11px var(--sans);fill:var(--mute)}
.node .badge rect{fill:var(--panel);stroke-width:1.2}
.node .badge text{font:700 10.5px var(--mono)}
.node.s-completed .box{stroke:var(--ok)}.node.s-completed .stripe{fill:var(--ok)}
.node.s-running .box{stroke:var(--run);stroke-dasharray:6 3}.node.s-running .stripe{fill:var(--run)}
.node.s-scheduled .box{stroke:var(--wait);stroke-dasharray:2 3}.node.s-scheduled .stripe{fill:var(--wait)}
.node.s-failed .box,.node.s-timed_out .box,.node.s-terminated .box{stroke:var(--bad)}
.node.s-failed .stripe,.node.s-timed_out .stripe,.node.s-terminated .stripe{fill:var(--bad)}
.node.s-canceled .box{stroke:var(--mute)}
.node.s-unreached .box,.node.s-pending .box{stroke:var(--ghost);stroke-dasharray:2 3}
.node.s-unreached .name,.node.s-pending .name{fill:var(--mute)}
.node.k-local .box{stroke-dasharray:5 3}
.node.sel .box{stroke-width:2.6}
.node:focus-visible .box{stroke:var(--accent);stroke-width:2.6}
.node:hover .box{stroke-width:2.2}
.bad-t{fill:var(--bad)}.wait-t{fill:var(--wait)}.run-t{fill:var(--run)}.mute-t{fill:var(--mute)}
.badge .bad-s{stroke:var(--bad)}.badge .wait-s{stroke:var(--wait)}.badge .mute-s{stroke:var(--line)}
.term circle{fill:var(--panel);stroke:var(--edge);stroke-width:1.4}
.term text{font:600 10px var(--mono);fill:var(--mute);letter-spacing:.04em}
.term.done circle{stroke:var(--ok)}
.arrow{fill:var(--edge)}.arrow-dim{fill:var(--ghost)}
@media (prefers-reduced-motion:no-preference){
  .node.s-running .box{animation:march 1.1s linear infinite}
  @keyframes march{to{stroke-dashoffset:-18}}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="ident">
      <span class="kicker"><a id="to-runs" href="?">kontra dev · runs</a> / graph</span>
      <h1 id="wf-type">Loading…</h1>
      <div class="sub"><code id="wf-id"></code><span id="wf-status" class="pill" hidden></span><span id="wf-time"></span></div>
    </div>
    <nav id="wf-links" class="links" aria-label="This run elsewhere"></nav>
  </header>
  <p id="notice" class="notice" hidden></p>
  <div id="graph-view" hidden>
    <div class="legend" aria-label="Legend">
      <span class="s-completed"><i></i>completed</span>
      <span class="s-running"><i class="dash"></i>running</span>
      <span class="s-scheduled"><i class="dot"></i>scheduled / backing off</span>
      <span class="s-failed"><i></i>failed</span>
      <span class="s-unreached"><i class="k-unreached"></i>branch not taken</span>
      <span><i class="k-group"></i>one workflow task (parallel)</span>
      <span><i class="k-child"></i>child workflow / batch</span>
      <span><i class="k-timer"></i>timer</span>
    </div>
    <div class="split">
      <main id="canvas" class="canvas" aria-label="Workflow graph"></main>
      <aside id="pane" class="pane" aria-live="polite"><p class="pane-empty">Select a step to see its attempts, timing, input and result, and to open it in Temporal UI, its logs or its trace.</p></aside>
    </div>
  </div>
  <section id="runs-view" class="runs" hidden aria-label="Recent runs"></section>
</div>

<script nonce="__NONCE__">
"use strict";
(() => {
const START = "start", END = "end";
const SVGNS = "http://www.w3.org/2000/svg";
const H = 54, R = 20, GX = 60, GY = 20;
let W = 184; // narrower in a vertical layout, to fit the screen

// ------------------------------------------------------------------ transport
// The dev codec server's routes. A page that defines window.KONTRA_CONSOLE (a preview) supplies its own.
const params = new URLSearchParams(location.search);
const api = window.KONTRA_CONSOLE || {
  query: { w: params.get("w"), r: params.get("r") },
  async json(url, headers) {
    const res = await fetch(url, { headers: { Accept: "application/json", ...(headers || {}) }, cache: "no-store" });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `${res.status} ${res.statusText}`);
    return body;
  },
  qs(w, r, extra) { const q = new URLSearchParams({ w }); if (r) q.set("r", r); for (const [k, v] of Object.entries(extra || {})) q.set(k, v); return q.toString(); },
  workflows() { return this.json("/api/workflows"); },
  graph(w, r) { return this.json(`/api/graph?${this.qs(w, r)}`); },
  io(w, r, node) { return this.json(`/api/io?${this.qs(w, r, { node })}`, { "X-Kontra-Console": "1" }); },
  subscribe(w, r, onGraph, onEnd, onLost) {
    const es = new EventSource(`/api/graph/events?${this.qs(w, r)}`);
    es.addEventListener("graph", ev => { try { onGraph(JSON.parse(ev.data)); } catch (_) { /* a torn frame: the next one repaints */ } });
    es.addEventListener("end", () => { es.close(); onEnd && onEnd(); });
    // EventSource reconnects by itself; once the server refuses (too many pages open, the
    // codec server stopped) it gives up, and the page says so.
    es.addEventListener("error", () => { if (es.readyState === EventSource.CLOSED && onLost) onLost(); });
    return () => es.close();
  },
  href(w, r) { return w ? `?${this.qs(w, r)}` : "?"; },
  now() { return Date.now(); },
};

// ------------------------------------------------------------------ helpers
const $ = id => document.getElementById(id);
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null && v !== false) n.setAttribute(k, v === true ? "" : String(v));
  for (const k of kids) if (k != null) n.append(k instanceof Node ? k : String(k));
  return n;
}
function sv(tag, attrs, ...kids) {
  const n = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) n.setAttribute(k, String(v));
  for (const k of kids) if (k != null) n.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return n;
}
const ms = iso => { const t = iso ? Date.parse(iso) : NaN; return Number.isNaN(t) ? null : t; };
function dur(a, b) {
  if (a == null || b == null) return null;
  const d = Math.max(0, b - a);
  if (d < 1000) return `${Math.round(d)} ms`;
  if (d < 60000) return `${(d / 1000).toFixed(d < 10000 ? 2 : 1)} s`;
  const m = Math.floor(d / 60000), s = Math.round((d % 60000) / 1000);
  return m < 60 ? `${m} m ${String(s).padStart(2, "0")} s` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")} m`;
}
const clock = iso => { const t = ms(iso); return t == null ? "—" : new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }); };
const STATUS = { completed: "completed", running: "running", scheduled: "scheduled", failed: "failed", timed_out: "timed out",
  canceled: "canceled", terminated: "terminated", continued_as_new: "continued as new", unreached: "not taken", pending: "not reached yet" };
const KIND = { activity: "activity", local_activity: "local activity", child: "child workflow", timer: "timer", nexus: "Nexus operation" };
const BATCH = "execute_activities_in_parallel";
function isBatch(n) { return n.kind === "child" && typeof n.label === "string" && n.label.startsWith(BATCH); }
function title(n) {
  if (isBatch(n)) { const m = /^execute_activities_in_parallel\((.*)\)$/.exec(n.label); return m ? m[1] : "parallel batch"; }
  return n.label || n.name || n.id;
}
// Text cut to fit px, measured in the font it is drawn in (a node's name, mono; its meta line, sans).
let pen = null;
function font(kind) {
  const css = getComputedStyle(document.documentElement);
  return kind === "name" ? `600 12.5px ${css.getPropertyValue("--mono").trim()}` : `11px ${css.getPropertyValue("--sans").trim()}`;
}
function width(text, face) {
  pen ||= document.createElement("canvas").getContext("2d");
  if (!pen) return text.length * 7.6;
  pen.font = face;
  return pen.measureText(text).width;
}
function fit(text, px, face) {
  if (width(text, face) <= px) return text;
  let lo = 1, hi = text.length - 1; // the longest start that fits with its ellipsis
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (width(text.slice(0, mid) + "…", face) <= px) lo = mid; else hi = mid - 1; }
  return text.slice(0, lo) + "…";
}

// ------------------------------------------------------------------ state
let G = null, selected = null, closeStream = null, ioCache = new Map(), running = false;

function stateOf(n) {
  if (n.reached === false) return running ? "pending" : "unreached";
  return n.status || "pending";
}

// ------------------------------------------------------------------ layout
function layout(g, vertical) {
  const nodes = g.nodes.filter(n => typeof n.id === "string");
  const ids = [START, ...nodes.map(n => n.id)];
  const hasEnd = g.edges.some(e => e.to === END);
  if (hasEnd) ids.push(END);
  const index = new Map(ids.map((id, i) => [id, i]));
  const edges = g.edges.filter(e => index.has(e.from) && index.has(e.to));
  const out = new Map(ids.map(id => [id, []]));
  for (const e of edges) out.get(e.from).push(e);
  for (const list of out.values()) list.sort((a, b) => index.get(a.to) - index.get(b.to));
  // Back edges (loops): an edge to a node still on the DFS stack. Iterative, so a long chain cannot overflow.
  const state = new Map(), back = new Set();
  for (const root of ids) {
    if (state.get(root)) continue;
    const stack = [[root, 0]]; state.set(root, 1);
    while (stack.length) {
      const top = stack[stack.length - 1], list = out.get(top[0]);
      if (top[1] >= list.length) { state.set(top[0], 2); stack.pop(); continue; }
      const e = list[top[1]++], s = state.get(e.to);
      if (s === 1) back.add(e); else if (!s) { state.set(e.to, 1); stack.push([e.to, 0]); }
    }
  }
  // Level: the longest path from start over forward edges.
  const fwd = edges.filter(e => !back.has(e));
  const indeg = new Map(ids.map(id => [id, 0])), preds = new Map(ids.map(id => [id, []]));
  for (const e of fwd) { indeg.set(e.to, indeg.get(e.to) + 1); preds.get(e.to).push(e.from); }
  const level = new Map(ids.map(id => [id, 0])), queue = ids.filter(id => indeg.get(id) === 0);
  while (queue.length) {
    const id = queue.shift();
    for (const e of out.get(id)) if (!back.has(e)) {
      level.set(e.to, Math.max(level.get(e.to), level.get(id) + 1));
      indeg.set(e.to, indeg.get(e.to) - 1);
      if (indeg.get(e.to) === 0) queue.push(e.to);
    }
  }
  if (hasEnd) level.set(END, Math.max(0, ...ids.filter(i => i !== END).map(i => level.get(i))) + 1);
  const levels = [];
  for (const id of ids) (levels[level.get(id)] ||= []).push(id);
  // Order within a level by the predecessors' places, parallel groups kept together.
  const byId = new Map(nodes.map(n => [n.id, n])), place = new Map();
  levels.forEach(L => L.forEach((id, k) => place.set(id, k)));
  for (let sweep = 0; sweep < 3; sweep++) for (const L of levels) {
    if (!L || L.length < 2) continue;
    const bary = id => { const p = preds.get(id); return p.length ? p.reduce((s, q) => s + place.get(q), 0) / p.length : place.get(id); };
    const groupOf = id => { const n = byId.get(id); return n && n.group != null ? `g${n.group}` : `n${id}`; };
    const gb = new Map();
    for (const id of L) { const k = groupOf(id); (gb.get(k) || gb.set(k, []).get(k)).push(bary(id)); }
    const gmean = k => gb.get(k).reduce((s, x) => s + x, 0) / gb.get(k).length;
    L.sort((a, b) => gmean(groupOf(a)) - gmean(groupOf(b)) || groupOf(a).localeCompare(groupOf(b)) || bary(a) - bary(b) || index.get(a) - index.get(b));
    L.forEach((id, k) => place.set(id, k));
  }
  const pos = new Map();
  levels.forEach((L, li) => (L || []).forEach((id, k) => {
    const along = li * (vertical ? H + GY + 26 : W + GX), across = (k - (L.length - 1) / 2) * (vertical ? W + 16 : H + GY);
    pos.set(id, vertical ? { x: across, y: along } : { x: along, y: across });
  }));
  // Parallel groups: two or more nodes of one workflow task side by side in a level.
  const groups = [];
  for (const L of levels) {
    if (!L) continue;
    const by = new Map();
    for (const id of L) { const n = byId.get(id); if (n && n.group != null) (by.get(n.group) || by.set(n.group, []).get(n.group)).push(id); }
    for (const [gid, members] of by) if (members.length > 1) groups.push({ id: gid, members });
  }
  return { ids, byId, edges, back, pos, groups, vertical, hasEnd, widest: Math.max(1, ...levels.map(l => (l ? l.length : 0))) };
}

// ------------------------------------------------------------------ drawing
function anchor(L, id, side) {
  const p = L.pos.get(id), term = id === START || id === END;
  const hw = term ? R : W / 2, hh = term ? R : H / 2;
  if (L.vertical) return side === "out" ? { x: p.x, y: p.y + hh } : side === "in" ? { x: p.x, y: p.y - hh } : { x: p.x + hw, y: p.y };
  return side === "out" ? { x: p.x + hw, y: p.y } : side === "in" ? { x: p.x - hw, y: p.y } : { x: p.x, y: p.y + hh };
}
function draw(g) {
  // Left to right when it fits the canvas, else top to bottom with nodes narrowed to fit.
  const avail = Math.max(280, $("canvas").clientWidth - 2);
  W = 184;
  let vertical = matchMedia("(max-width: 640px)").matches;
  let L = layout(g, vertical);
  if (!vertical) {
    const across = [...L.pos.values()].map(p => p.x);
    vertical = Math.max(...across) - Math.min(...across) + W + 48 > avail;
  }
  if (vertical) {
    W = Math.max(120, Math.min(184, Math.floor((avail - 48 - (L.widest - 1) * 16) / L.widest)));
    L = layout(g, true);
  }
  const xs = [...L.pos.values()].map(p => p.x), ys = [...L.pos.values()].map(p => p.y);
  let minX = Math.min(...xs) - W / 2 - 24, maxX = Math.max(...xs) + W / 2 + 24;
  let minY = Math.min(...ys) - H / 2 - 30, maxY = Math.max(...ys) + H / 2 + 24;
  const svg = sv("svg", { xmlns: SVGNS, role: "group", "aria-label": `${g.workflow?.type || "Workflow"} graph` });
  const defs = sv("defs");
  for (const [id, cls] of [["arr", "arrow"], ["arr-dim", "arrow-dim"]])
    defs.append(sv("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, sv("path", { d: "M0,0 L10,5 L0,10 z", class: cls })));
  svg.append(defs);
  const layer = { grp: sv("g"), edge: sv("g"), node: sv("g") };
  svg.append(layer.grp, layer.edge, layer.node);
  // parallel groups
  for (const grp of L.groups) {
    const ps = grp.members.map(id => L.pos.get(id));
    const x0 = Math.min(...ps.map(p => p.x)) - W / 2 - 10, x1 = Math.max(...ps.map(p => p.x)) + W / 2 + 10;
    const y0 = Math.min(...ps.map(p => p.y)) - H / 2 - 20, y1 = Math.max(...ps.map(p => p.y)) + H / 2 + 10;
    layer.grp.append(sv("rect", { class: "grp", x: x0, y: y0, width: x1 - x0, height: y1 - y0, rx: 10 }),
      sv("text", { class: "grp-label", x: x0 + 10, y: y0 + 13 }, "parallel · one task"));
    minY = Math.min(minY, y0 - 8);
  }
  // edges
  let detour = 0;
  for (const e of L.edges) {
    const dim = e.reached === false;
    const attrs = { class: `edge${dim ? " dim" : ""}`, "marker-end": `url(#${dim ? "arr-dim" : "arr"})` };
    let d;
    if (e.from === e.to) { // a loop over one call site
      const p = L.pos.get(e.from);
      d = vertical ? `M${p.x + W / 2},${p.y - 12} C${p.x + W / 2 + 40},${p.y - 30} ${p.x + W / 2 + 40},${p.y + 30} ${p.x + W / 2},${p.y + 12}`
                   : `M${p.x - 16},${p.y - H / 2} C${p.x - 24},${p.y - H / 2 - 40} ${p.x + 24},${p.y - H / 2 - 40} ${p.x + 16},${p.y - H / 2}`;
      attrs.class += " back";
      if (!vertical) minY = Math.min(minY, p.y - H / 2 - 40);
    } else if (L.back.has(e)) { // back to an earlier step: around the graph
      const a = anchor(L, e.from, "side"), b = anchor(L, e.to, "side");
      detour += 14;
      if (vertical) { const x = Math.max(a.x, b.x) + 30 + detour; d = `M${a.x},${a.y} C${x},${a.y} ${x},${b.y} ${b.x},${b.y}`; maxX = Math.max(maxX, x + 10); }
      else { const y = Math.max(...ys) + H / 2 + 26 + detour; d = `M${a.x},${a.y} C${a.x},${y} ${b.x},${y} ${b.x},${b.y}`; maxY = Math.max(maxY, y + 10); }
      attrs.class += " back";
    } else {
      const a = anchor(L, e.from, "out"), b = anchor(L, e.to, "in");
      if (vertical) { const k = Math.max(18, (b.y - a.y) / 2); d = `M${a.x},${a.y} C${a.x},${a.y + k} ${b.x},${b.y - k} ${b.x},${b.y}`; }
      else { const k = Math.max(18, (b.x - a.x) / 2); d = `M${a.x},${a.y} C${a.x + k},${a.y} ${b.x - k},${b.y} ${b.x},${b.y}`; }
    }
    layer.edge.append(sv("path", { ...attrs, d }));
  }
  // start / end
  for (const id of [START, END]) {
    if (!L.pos.has(id)) continue;
    const p = L.pos.get(id);
    const done = id === START || (G.workflow && G.workflow.status === "completed");
    layer.node.append(sv("g", { class: `term${done ? " done" : ""}`, transform: `translate(${p.x},${p.y})` },
      sv("circle", { r: R }), sv("text", { "text-anchor": "middle", y: 3.5 }, id)));
  }
  // nodes
  const now = api.now(), faces = { name: font("name"), meta: font("meta") };
  for (const [id, n] of L.byId) {
    if (!L.pos.has(id)) continue;
    const p = L.pos.get(id), st = stateOf(n);
    const kind = n.kind === "local_activity" ? " k-local" : "";
    const label = title(n);
    const meta = metaLine(n, st, now);
    const g1 = sv("g", { class: `node s-${st}${kind}${selected === id ? " sel" : ""}`, transform: `translate(${p.x},${p.y})`,
      tabindex: 0, role: "button", "data-id": id,
      "aria-label": `${label}, ${KIND[n.kind] || n.kind}${isBatch(n) ? " batch" : ""}, ${STATUS[st] || st}${n.attempt > 1 ? `, attempt ${n.attempt}` : ""}` });
    g1.append(sv("title", {}, `${n.label || n.name}${n.id !== n.name ? `  (${n.id})` : ""}`));
    const rx = n.kind === "timer" ? H / 2 : 7;
    if (n.kind === "nexus") {
      const c = 10, x0 = -W / 2, x1 = W / 2, y0 = -H / 2, y1 = H / 2;
      g1.append(sv("path", { class: "box", d: `M${x0 + c},${y0} H${x1 - c} L${x1},${y0 + c} V${y1 - c} L${x1 - c},${y1} H${x0 + c} L${x0},${y1 - c} V${y0 + c} Z` }));
    } else {
      g1.append(sv("rect", { class: "box", x: -W / 2, y: -H / 2, width: W, height: H, rx }));
    }
    if (n.kind === "child") g1.append(sv("rect", { class: "inner", x: -W / 2 + 4, y: -H / 2 + 4, width: W - 8, height: H - 8, rx: 4 }));
    if (n.kind !== "timer") g1.append(sv("rect", { class: "stripe", x: -W / 2 + (n.kind === "child" ? 7 : 4), y: -H / 2 + 9, width: 3.5, height: H - 18, rx: 1.75 }));
    const tx = -W / 2 + (n.kind === "timer" ? 20 : 16);
    g1.append(sv("text", { class: "name", x: tx, y: -3 }, fit(label, W - (tx + W / 2) - 12, faces.name)));
    g1.append(sv("text", { class: "meta", x: tx, y: 14 }, fit(meta, W - (tx + W / 2) - 6, faces.meta)));
    // badges: retries, fan-out width, iterations
    const badges = [];
    if (n.attempt > 1) badges.push([`×${n.attempt}`, st === "failed" || st === "timed_out" ? "bad" : "wait"]);
    if (n.parallel > 1) badges.push([`∥${n.parallel}`, "mute"]);
    if (n.count > 1 && n.count > (n.parallel || 1)) badges.push([`↻${Math.round(n.count / Math.max(1, n.parallel || 1))}`, "mute"]);
    let bx = W / 2 - 4;
    for (const [text, tone] of badges) {
      const bw = 10 + text.length * 7.2;
      bx -= bw;
      g1.append(sv("g", { class: "badge", transform: `translate(${bx},${-H / 2 - 9})` },
        sv("rect", { class: `${tone}-s`, width: bw, height: 17, rx: 8.5 }),
        sv("text", { class: `${tone}-t`, x: bw / 2, y: 12.2, "text-anchor": "middle" }, text)));
      bx -= 4;
    }
    g1.addEventListener("click", () => select(id));
    g1.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(id); } });
    layer.node.append(g1);
  }
  svg.setAttribute("viewBox", `${minX} ${minY} ${maxX - minX} ${maxY - minY}`);
  svg.setAttribute("width", Math.ceil(maxX - minX));
  svg.setAttribute("height", Math.ceil(maxY - minY));
  const focused = document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute("data-id");
  $("canvas").replaceChildren(svg);
  if (focused) { const f = svg.querySelector(`[data-id="${CSS.escape(focused)}"]`); f && f.focus({ preventScroll: true }); }
}
function metaLine(n, st, now) {
  if (st === "unreached") return "branch not taken";
  if (st === "pending") return "not reached yet";
  const t = n.t || {};
  const kind = isBatch(n) ? "batch · " : n.kind === "child" ? "child · " : "";
  if (st === "running" || st === "scheduled") {
    // Backing off: since the attempt that failed ended, not since the step was first scheduled.
    const backoff = st === "scheduled" && n.attempt > 1;
    const d = dur(backoff ? ms(t.last_failed) : ms(t.started) ?? ms(t.scheduled), now);
    return `${kind}${backoff ? "backing off" : st}${d ? ` ${d}` : ""}`;
  }
  // The stripe already says completed: the line is its duration; anything else names itself.
  const d = dur(ms(t.scheduled), ms(t.closed));
  if (st === "completed") return `${kind}${d || "done"}`;
  return `${kind}${STATUS[st] || st}${d ? ` · ${d}` : ""}`;
}

// ------------------------------------------------------------------ the pane
function select(id) {
  selected = selected === id ? null : id;
  draw(G);
  pane();
}
function linkRow(links, labels) {
  const row = el("div", { class: "links" });
  for (const [k, text] of labels) if (links && links[k]) row.append(el("a", { href: links[k], target: "_blank", rel: "noopener noreferrer" }, `${text} ↗`));
  return row.childElementCount ? row : null;
}
// What the codec server shows in place of a payload it cannot open (never its bytes).
function sealed(v) {
  if (!v || typeof v !== "object" || Array.isArray(v)) return null;
  const keys = Object.keys(v);
  if (keys.length !== 1 || v[keys[0]] !== true) return null;
  return { encrypted: "Encrypted to keys this machine does not hold: not shown.",
    claim_check: "Stored in the bucket (claim-checked): the codec server does not fetch it." }[keys[0]] || null;
}
function json(v) {
  const said = sealed(v);
  if (said) return el("p", { class: "muted" }, said);
  if (v && typeof v === "object" && !Array.isArray(v) && v.error === "undecodable" && Object.keys(v).length === 1)
    return el("p", { class: "muted" }, "Could not be decoded with this machine's keys: not shown.");
  return el("pre", {}, v === undefined || v === null ? "—" : JSON.stringify(v, null, 2));
}
function pane() {
  const box = $("pane");
  const n = selected && G.nodes.find(x => x.id === selected);
  if (!n) { box.replaceChildren(el("p", { class: "pane-empty" }, "Select a step to see its attempts, timing, input and result, and to open it in Temporal UI, its logs or its trace.")); return; }
  const st = stateOf(n), t = n.t || {}, ref = n.ref || {};
  const facts = el("dl", { class: "facts" });
  const fact = (k, v) => { if (v != null && v !== "") facts.append(el("dt", {}, k), el("dd", {}, v)); };
  fact("Attempt", n.attempt ? (n.attempt > 1 ? `${n.attempt} (retried ${n.attempt - 1}×)` : "1") : null);
  if (n.count > 1) fact("Ran", n.parallel > 1 ? `${n.count} times, up to ${n.parallel} at once` : `${n.count} times (a loop)`);
  const closed = ms(t.closed), start = ms(t.scheduled);
  fact("Duration", closed != null ? dur(start, closed) : start != null && (st === "running" || st === "scheduled") ? `${dur(start, api.now())} so far` : null);
  fact("Scheduled", t.scheduled ? clock(t.scheduled) : null);
  fact("Started", t.started ? clock(t.started) : null);
  fact("Last attempt failed", t.last_failed ? clock(t.last_failed) : null);
  fact("Closed", t.closed ? clock(t.closed) : null);
  fact("Task queue", ref.task_queue);
  fact("Activity id", ref.activity_id);
  fact(n.kind === "child" ? "Child workflow" : "Workflow", n.kind === "child" ? ref.workflow_id : null);
  fact("Child run", n.kind === "child" ? ref.run_id : null);
  fact("Event", ref.event_id != null ? `#${ref.event_id}` : null);
  fact("Trace", ref.trace_id);
  const kind = isBatch(n) ? `batch · ${BATCH}` : KIND[n.kind] || n.kind;
  const parts = [el("h2", {}, title(n)),
    el("div", { class: "chips" }, el("span", { class: `pill s-${st}` }, STATUS[st] || st), el("span", { class: "chip" }, kind),
      n.id !== title(n) ? el("span", { class: "chip" }, n.id) : null)];
  if (st === "unreached" || st === "pending") {
    parts.push(st === "pending"
      ? el("p", { class: "muted" }, "This run has not reached this step yet. It appears because the mock runs ", el("code", {}, "kontra serve"), " drew the graph from reached it.")
      : el("p", { class: "muted" }, "This run did not take this branch. It appears because the mock runs ", el("code", {}, "kontra serve"), " drew the graph from took it."));

  }
  parts.push(facts);
  const links = linkRow(n.links, [["temporal", n.kind === "child" ? "Child run in Temporal UI" : "Event in Temporal UI"], ["logs", "Logs"], ["trace", "Trace"]]);

  const show = io => {
    if (selected !== n.id) return;

  api.io(G.workflow.workflow_id, G.workflow.run_id, n.id).then(io => { ioCache.set(key, io); show(io); })
    .catch(err => { if (selected === n.id) ioSlot.replaceChildren(el("p", { class: "muted" }, `Payloads unavailable: ${err.message}. Nothing is shown rather than ciphertext.`)); });
}
function failureBox(n, decoded) {
  const f = n.failure || {};
  const recovered = n.status === "completed";
  const head = recovered ? `recovered after ${Math.max(1, (n.attempt || 2) - 1)} failed attempt${(n.attempt || 2) > 2 ? "s" : ""}` : `${f.kind || "failure"}${f.timeout_type ? ` · ${f.timeout_type.replace(/_/g, " ")}` : ""}`;
  const box = el("div", { class: "fail" }, el("strong", {}, recovered ? `Last failure · ${head}` : `Failure · ${head}`));
  if (decoded && decoded.error) box.append(el("p", {}, "The message could not be decoded with this machine's keys."));
  else if (sealed(decoded)) box.append(el("p", { class: "muted" }, `The message: ${sealed(decoded)}`));
  else if (decoded && decoded.message) {
    box.append(el("p", {}, decoded.message));
    if (decoded.stack_trace) box.append(el("details", {}, el("summary", {}, "Stack trace"), el("pre", {}, decoded.stack_trace)));
  } else box.append(el("p", { class: "muted" }, decoded === undefined ? "Decoding the message…"
    : decoded === null && (n.status === "running" || n.status === "scheduled") ? "The message is not available yet." : "No message."));
  if (f.retry_state) box.append(el("p", { class: "muted" }, `Retry state: ${f.retry_state.replace(/_/g, " ")}`));
  return box;
}

// ------------------------------------------------------------------ the header
function header(g) {
  const wf = g.workflow || {};
  running = wf.status === "running";
  document.title = `${wf.type || "Run"} · Kontra Run Graph`;
  $("wf-type").textContent = wf.type || "Workflow";
  $("wf-id").textContent = wf.workflow_id || "";
  const pill = $("wf-status");
  pill.hidden = !wf.status; pill.className = `pill s-${wf.status}`; pill.textContent = STATUS[wf.status] || wf.status || "";
  const t = wf.t || {};
  const end = ms(t.closed) ?? (running ? api.now() : null);
  const d = dur(ms(t.started), end);
  $("wf-time").textContent = t.started ? `started ${clock(t.started)}${d ? ` · ${running ? "running for " : "took "}${d}` : ""}` : "";
  const nav = linkRow(wf.links, [["temporal", "Temporal UI"], ["logs", "Logs"], ["trace", "Trace"]]);
  $("wf-links").replaceChildren(...(nav ? nav.childNodes : []));
  const note = $("notice");
  if (g.static_graph === false) {
    if (g.handler) note.replaceChildren("This offering's entry is a handler, so only what this run did is drawn.");
    else note.replaceChildren("No static graph for this offering yet: start ", el("code", {}, "kontra serve"), " once and it is drawn in the background.");
    note.hidden = false;
  } else note.hidden = true;
}

// ------------------------------------------------------------------ views
function paint(g) {
  G = g;
  header(g);
  draw(g);
  if (selected && !g.nodes.some(n => n.id === selected)) selected = null;
  pane();
}
async function graphView(w, r) {
  $("graph-view").hidden = false; $("runs-view").hidden = true;
  $("to-runs").href = api.href(null);
  try { paint(await api.graph(w, r)); } catch (err) { fail(err); return; }
  if (closeStream) closeStream();
  closeStream = api.subscribe(w, r || G.workflow.run_id, paint, () => {}, () => {
    if (!running) return;
    const note = $("notice");
    note.textContent = "Live updates stopped: the codec server refused or went away. Reload the page to resume.";
    note.hidden = false;
  });
}
async function runsView() {
  $("graph-view").hidden = true;
  $("wf-type").textContent = "Recent runs"; $("wf-id").textContent = ""; $("wf-status").hidden = true; $("wf-time").textContent = "";
  let runs;
  try { runs = await api.workflows(); } catch (err) { fail(err); return; }
  const rows = runs.map(x => el("tr", {},
    el("td", {}, el("span", { class: `pill s-${x.status}` }, STATUS[x.status] || x.status)),
    el("td", {}, el("a", { href: api.href(x.workflow_id, x.run_id), "data-w": x.workflow_id, "data-r": x.run_id }, x.type)),
    el("td", { class: "num" }, x.workflow_id),
    el("td", { class: "num" }, clock(x.start_time)),
    el("td", { class: "num" }, dur(ms(x.start_time), ms(x.close_time) ?? api.now()) || "—")));
  const table = el("table", {}, el("thead", {}, el("tr", {}, ...["Status", "Workflow", "Id", "Started", "Duration"].map(h => el("th", {}, h)))), el("tbody", {}, ...rows));
  const view = $("runs-view");
  view.replaceChildren(runs.length ? table : el("p", { class: "muted pad" }, "No runs in this namespace yet. Hire a job, or start a workflow on your worker's task queue."));
  view.hidden = false;
}
function fail(err) {
  const note = $("notice");
  note.textContent = `Could not load: ${err.message}`;
  note.hidden = false;
}
addEventListener("resize", () => { if (G) draw(G); });
// While the run is open, its clocks keep moving between events.
setInterval(() => { if (G && running && !document.hidden) { header(G); draw(G); } }, 1000);
if (api.query.w) graphView(api.query.w, api.query.r); else runsView();
window.KONTRA_CONSOLE_OPEN = (w, r) => { selected = null; ioCache.clear(); if (w) graphView(w, r); else runsView(); };
})();
</script>
