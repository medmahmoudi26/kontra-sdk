# Supply-chain and secret checks (PRD §19.4): gitleaks on every push, pip-audit over the
# locked dependencies, Trivy on the Temporal image as CI builds it, and an SBOM of the
# repository. One action each, pinned by commit SHA. The weekly run catches advisories
# published against code that has not changed.

name: security

on:
  # Pushes to dev, and every pull request: a pull request's branch is scanned once, by its
  # pull_request run, not a second time by its push.
  push:
    branches: [dev]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.11.7"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ${{ vars.KONTRA_RUNNER && fromJSON(vars.KONTRA_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # list a pull request's commits to scan exactly those
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_CONFIG: .github/gitleaks.toml
          # Findings are reported redacted, in the job summary only: no PR comment, and no
          # report artifact that would outlive the run.
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  pip-audit:
    name: pip-audit
    runs-on: ${{ vars.KONTRA_RUNNER && fromJSON(vars.KONTRA_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Everything uv.lock pins -- the package's dependencies, every extra, and the dev
      # group CI itself runs -- with hashes, so the audit is of exactly what gets installed.
      - name: Export the locked dependencies
        run: >-
          uv export --locked --all-extras --all-groups --no-emit-project
          --format requirements.txt --output-file requirements-audit.txt
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements-audit.txt
          require-hashes: true

  trivy:
    name: trivy
    runs-on: ${{ vars.KONTRA_RUNNER && fromJSON(vars.KONTRA_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The shipped image (multi-stage Dockerfile), built as temporal-image.yml builds it.
      # Reads the layer cache CI's e2e job writes; writes none, so this workflow cannot
      # change what another one builds from.
      - name: Build the Temporal image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: temporal/authorizer
          file: temporal/authorizer/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: kontra-temporal:scan
          cache-from: type=gha,scope=kontra-temporal
      # Trivy's tag-hijack incident (GHSA-69fq-xp46-6x23, March 2026) is why the action is
      # pinned to a post-incident immutable release and the Trivy version is explicit.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: kontra-temporal:scan
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

  sbom:
    name: sbom
    runs-on: ${{ vars.KONTRA_RUNNER && fromJSON(vars.KONTRA_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The repository's dependency graph: uv.lock (the package, its extras, the dev group)
      # and temporal/authorizer/go.sum (the Temporal server and the Authorizer). Uploaded as a
      # run artifact; release.yml attaches the same SBOM to each release.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: kontra-sdk.spdx.json
          dependency-snapshot: false
          upload-release-assets: false

  zizmor:
    name: zizmor
    runs-on: ${{ vars.KONTRA_RUNNER && fromJSON(vars.KONTRA_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The workflows themselves: template injection, excessive permissions, unpinned or
      # impostor actions, credential persistence, cache poisoning.
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: "1.30.1" # the action pulls this release's image by digest
          advanced-security: false
          persona: regular
