# Kontra's Temporal server image, ghcr.io/medmahmoudi26/kontra-temporal (PRD §13, §19.4).
#
# Only a change under temporal/authorizer/ rebuilds it -- the Authorizer, the callback
# guard, the server binary, the dynamic config, the Dockerfile, and go.mod, which pins the
# Temporal server version (go.temporal.io/server). Nothing else triggers it.
#
# A pull request (or a manual run on any branch but dev) builds the image without pushing.
# Only dev pushes: tagged with the full commit SHA, and :dev moved to it, the tag
# compose.yaml (`kontra dev`) pulls by default. Every pushed image carries a BuildKit SBOM
# and max-mode provenance.

name: temporal-image

on:
  push:
    branches: [dev]
    paths:
      - "temporal/authorizer/**"
      - ".github/workflows/temporal-image.yml"
  pull_request:
    paths:
      - "temporal/authorizer/**"
      - ".github/workflows/temporal-image.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: temporal-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/medmahmoudi26/kontra-temporal

jobs:
  build:
    name: build
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/dev'
    runs-on: ${{ vars.KONTRA_RUNNER && fromJSON(vars.KONTRA_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: temporal/authorizer
          file: temporal/authorizer/Dockerfile
          platforms: linux/amd64
          push: false

  publish:
    name: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ${{ vars.KONTRA_RUNNER && fromJSON(vars.KONTRA_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push to ghcr.io/medmahmoudi26/kontra-temporal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The Temporal server version go.mod pins
        id: pin
        run: |
          version="$(awk '$1 == "go.temporal.io/server" { print $2; exit }' temporal/authorizer/go.mod)"
          if [ -z "$version" ]; then
            echo "::error::temporal/authorizer/go.mod does not require go.temporal.io/server"
            exit 1
          fi
          echo "server=$version" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
          labels: |
            org.opencontainers.image.title=kontra-temporal
            org.opencontainers.image.description=Kontra's Temporal server: the Authorizer and callback guard on the public frontend
            run.kontra.temporal-server=${{ steps.pin.outputs.server }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Built from scratch, no layer cache: what is pushed is never assembled from cache
      # entries another workflow (or a pull request) wrote.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: temporal/authorizer
          file: temporal/authorizer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
